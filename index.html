<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simple Password Generator</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg,#e0f7fa,#e1f5fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #0d47a1;
    }
    input {
      width: 60px;
      padding: 8px;
      margin-right: 8px;
      border-radius: 8px;
      border: 1px solid #90caf9;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #1e88e5;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1565c0;
    }
    .note {
      font-size: 12px;
      color: #1565c0;
      margin-top: 4px;
    }
    .output {
      margin-top: 20px;
      font-family: monospace;
      background: rgba(255,255,255,0.6);
      padding: 12px;
      border-radius: 12px;
      word-break: break-all;
      font-size: 16px;
      color: #0b3d91;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Random Password Generator</h1>
    <div>
      <label for="length">Length:</label>
      <input type="number" id="length" value="12" min="4" max="64">
      <button id="generate">Generate</button>
      <div class="note">Cap at 64 length</div>
    </div>
    <div class="output" id="passwordOutput">Your password will appear here</div>
  </div>

  <script>
    const generateBtn = document.getElementById('generate');
    const output = document.getElementById('passwordOutput');

    function generatePassword(length) {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+{}[]<>?~';
      let password = '';
      for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * chars.length);
        password += chars[randomIndex];
      }
      return password;
    }

    generateBtn.addEventListener('click', () => {
      let length = parseInt(document.getElementById('length').value);
      if (isNaN(length) || length < 4) {
        alert('Please enter a valid length between 4 and 64');
        return;
      }
      if (length > 64) length = 64;
      const password = generatePassword(length);
      output.textContent = password;
    });
  </script>
</body>
</html>
